server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: agendamiento
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medicita}
    username: ${SPRING_DATASOURCE_USERNAME:medicita}
    password: ${SPRING_DATASOURCE_PASSWORD:medicita}
    hikari:
      maximum-pool-size: ${MEDICITA_POOL_BD:20}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    connect-retries: 10
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:localhost:5672}
    username: ${SPRING_RABBITMQ_USERNAME:medicita}
    password: ${SPRING_RABBITMQ_PASSWORD:medicita}
    virtual-host: /
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  task:
    scheduling:
      pool:
        size: 3
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    co.edu.ucc.medicita: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      # OUTBOX_ATRASADA es una alarma, no una falla de vida: el gateway sigue enrutando (HTTP 200)
      status:
        order: DOWN,OUT_OF_SERVICE,OUTBOX_ATRASADA,UP,UNKNOWN
        http-mapping:
          OUTBOX_ATRASADA: 200
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState
  health:
    # RabbitMQ y Redis caídos no tumban al agendamiento: la reserva no depende del broker ni de la caché
    rabbit:
      enabled: false
    redis:
      enabled: false

medicita:
  instancia: ${MEDICITA_INSTANCIA:local}
  jwt:
    issuer: ${MEDICITA_JWT_ISSUER:https://localhost/auth/realms/medicita}
    jwks-uri: ${MEDICITA_JWKS_URI:http://localhost:8080/auth/realms/medicita/protocol/openid-connect/certs}
  replica:
    url: ${MEDICITA_REPLICA_URL:}
  semilla:
    habilitada: ${MEDICITA_SEMILLA:true}
