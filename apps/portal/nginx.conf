server {
  listen 80;
  listen [::]:80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # El gateway reenvía /portal/ sin quitar el prefijo; los archivos viven en /portal/.
  # "/" también sirve el index (healthcheck y acceso directo).
  location = / {
    add_header Cache-Control "no-cache";
    try_files /portal/index.html =404;
  }

  location = /portal {
    return 301 /portal/;
  }

  # Archivos con hash: caché larga
  location /portal/assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html y service workers (si los hubiera) nunca se cachean
  location ~ ^/portal/(index\.html|sw\.js)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # SPA: cualquier ruta bajo /portal/ cae en index.html
  location /portal/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /portal/index.html;
  }
}
