# docker compose up  ->  http://localhost:8080
# Four long-running containers as in the report (app, postgres, ticker, fake
# provider) plus a one-shot `migrate` that holds the owner credentials so the
# app never does. Secrets below are development values only.

x-secrets: &secrets
  CLINICAL_KEY: 9f1c2b7e4a6d8c0f3e5b7a9c1d3f5e7a9b1c3d5e7f9a1b3c5d7e9f1a3b5c7d9e
  TICK_TOKEN: dev-tick-token
  IDENTITY_DB_PASSWORD: identity_dev
  SCHEDULING_DB_PASSWORD: scheduling_dev
  CLINICAL_DB_PASSWORD: clinical_dev
  NOTIFICATIONS_DB_PASSWORD: notifications_dev
  AUDIT_DB_PASSWORD: audit_dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic_owner
      POSTGRES_PASSWORD: clinic_owner_dev
      POSTGRES_DB: clinic
    ports: ["55432:5432"] # 5432 is often taken by a local install
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_owner -d clinic"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["migrate", "-seed"]
    environment:
      <<: *secrets
      OWNER_DATABASE_URL: postgres://clinic_owner:clinic_owner_dev@postgres:5432/clinic?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    build: .
    command: ["clinic"]
    environment:
      <<: *secrets
      DATABASE_URL: postgres://postgres:5432/clinic # user/password are set per module role
      TOKEN_SECRET: dev-token-secret-change-me-please
      PROVIDER_URL: http://fakeprovider:8081
      DEMO_MODE: "true"
      DRAIN_INTERVAL: 2s
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      fakeprovider: { condition: service_started }
    restart: unless-stopped # T10: the platform restarts a dead process (E-3)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  ticker:
    build: .
    command: ["ticker"]
    environment:
      APP_URL: http://app:8080
      TICK_TOKEN: dev-tick-token
      TICK_INTERVAL: 30s # the report uses 5m; shortened so the demo moves
      TICK_HOURS: ""      # e.g. "7-19" for business hours only (T11)
    depends_on:
      app: { condition: service_started }
    restart: unless-stopped

  fakeprovider:
    build: .
    command: ["fakeprovider"]
    ports: ["8081:8081"]
    restart: unless-stopped

volumes:
  pgdata:
