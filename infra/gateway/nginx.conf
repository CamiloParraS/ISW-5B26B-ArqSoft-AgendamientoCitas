# API Gateway MediCita (SPEC §3)
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 2m;

    # Resolutor DNS de Docker: los destinos con variable se resuelven en cada petición
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Correlación: respeta X-Correlation-Id entrante o usa $request_id ---
    map $http_x_correlation_id $correlacion {
        ""      $request_id;
        default $http_x_correlation_id;
    }

    # Puerto público (para X-Forwarded-Port), tomado del Host
    map $http_host $puerto_publico {
        default          443;
        "~:(?<p>\d+)$"   $p;
    }

    # --- Límite de tasa por usuario: Authorization si existe, si no IP ---
    map $http_authorization $limite_clave {
        ""      $binary_remote_addr;
        default $http_authorization;
    }
    limit_req_zone $limite_clave zone=api:10m      rate=20r/s;
    limit_req_zone $limite_clave zone=reservas:10m rate=3r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # --- Bitácora de acceso en JSON ---
    log_format medicita_json escape=json
        '{"ts":"$time_iso8601","correlacionId":"$correlacion","remoto":"$remote_addr",'
        '"metodo":"$request_method","uri":"$request_uri","estado":$status,'
        '"upstream":"$upstream_addr","upstreamEstado":"$upstream_status",'
        '"duracion":$request_time,"upstreamDuracion":"$upstream_response_time","bytes":$body_bytes_sent}';
    access_log /dev/stdout medicita_json;

    # Upstream de la API de Agendamiento (generado al arrancar por 35-upstream-agendamiento.sh)
    include /etc/nginx/conf.d/upstream-agendamiento.inc;

    # Redirect 80 -> https (plantilla con el puerto publicado)
    include /etc/nginx/conf.d/redirect-http.conf;

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/medicita.crt;
        ssl_certificate_key /etc/nginx/certs/medicita.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:5m;

        add_header X-Correlation-Id $correlacion always;
        add_header X-Content-Type-Options nosniff always;

        # Cabeceras comunes de proxy
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $puerto_publico;
        proxy_set_header X-Correlation-Id  $correlacion;
        proxy_set_header Connection        "";
        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;

        error_page 429 = @limite;
        location @limite {
            default_type application/json;
            add_header X-Correlation-Id $correlacion always;
            return 429 '{"codigo":"LIMITE_DE_TASA","mensaje":"Demasiadas solicitudes, intente en unos segundos"}';
        }

        # --- Identidad (Keycloak): conserva el prefijo /auth/ ---
        location /auth/ {
            set $keycloak http://keycloak:8080;
            proxy_pass $keycloak;
            proxy_hide_header X-Correlation-Id;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # --- Portal clínico-administrativo: conserva /portal/ ---
        location /portal/ {
            set $portal http://app-portal:80;
            proxy_pass $portal;
            proxy_hide_header X-Correlation-Id;
        }

        # --- API de Agendamiento: reservas (más estricto y con reintento de POST) ---
        # non_idempotent es seguro porque toda reserva lleva Idempotency-Key.
        location ~ ^/api/agenda/(citas|retenciones) {
            limit_req zone=api      burst=40 nodelay;
            limit_req zone=reservas burst=6  nodelay;
            proxy_pass http://agendamiento;
            proxy_hide_header X-Correlation-Id;
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 2;
        }

        # --- API de Agendamiento: resto ---
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://agendamiento;
            proxy_hide_header X-Correlation-Id;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # --- App web del paciente (PWA) ---
        location / {
            set $paciente http://app-paciente:80;
            proxy_pass $paciente;
            proxy_hide_header X-Correlation-Id;
        }
    }
}
