# Clúster de 3 nodos (rabbit@rabbitmq-1..3), descubrimiento por lista fija
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

# Usuario de la demo (el usuario guest queda sin crear)
default_user = medicita
default_pass = medicita
default_vhost = /

# Quórum de 2 de 3: ante partición, la minoría se pausa (colas quorum siguen en la mayoría)
cluster_partition_handling = pause_minority

# Márgenes de memoria/disco razonables para Docker Desktop
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 200MB

management.tcp.port = 15672
